<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" role="img" aria-label="Vale Palheiro — Earth Resort" fill="none">
  <!--
    Editorial VALE PALHEIRO wordmark (brand guide p.10 / logo file p.4).
    Thin even strokes, generous tracking. Signature details:
      · V and A as clean open triangles (pointed apex)
      · E as three horizontal bars, middle bar slightly shorter
      · round O
    currentColor so it inherits terracotta / off-white / anthracite.
  -->
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- VALE -->
    <path d="M12 52 L24 100 L36 52"/>                         <!-- V -->
    <path d="M52 100 L64 52 L76 100 M57 84 H71"/>             <!-- A -->
    <path d="M92 52 V100 H112"/>                              <!-- L -->
    <path d="M128 52 H150 M128 76 H146 M128 100 H150"/>       <!-- E -->
    <!-- PALHEIRO (after a wide word space) -->
    <path d="M232 100 V52 H248 a12 12 0 0 1 0 24 H232"/>      <!-- P -->
    <path d="M272 100 L284 52 L296 100 M277 84 H291"/>        <!-- A -->
    <path d="M312 52 V100 H332"/>                             <!-- L -->
    <path d="M348 52 V100 M374 52 V100 M348 76 H374"/>        <!-- H -->
    <path d="M390 52 H412 M390 76 H408 M390 100 H412"/>       <!-- E -->
    <path d="M428 52 V100"/>                                  <!-- I -->
    <path d="M444 100 V52 H460 a12 12 0 0 1 0 24 H444 M458 76 L472 100"/> <!-- R -->
    <circle cx="500" cy="76" r="22"/>                         <!-- O -->
  </g>
  <!-- EARTH RESORT beneath, centred under the whole wordmark -->
  <text x="256" y="138" text-anchor="middle"
        font-family="Jost, 'General Sans', Helvetica, Arial, sans-serif"
        font-size="12" letter-spacing="8" fill="currentColor">EARTH RESORT</text>
</svg>
