# Render deployment config for Terra.
# One free web service that runs the Node server directly from source.
# See https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vale-palheiro
    runtime: node
    plan: free
    # No external deps, so there is nothing to build — just ensure Node is present.
    buildCommand: "echo no build needed"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # Change these in the Render dashboard to set your own staff login.
      - key: TERRA_USER
        value: "palheiro"
      - key: TERRA_PASS
        value: "costa-vicentina"
      # Live weather for the recommendation agent (leave unset for the simulated demo forecast):
      # - key: WEATHER_SOURCE
      #   value: "open-meteo"
      # - key: OPEN_METEO_API_KEY   # commercial key from open-meteo.com
      #   sync: false
      # Supabase persistence (guest preferences + events consent).
      # Set both in the Render dashboard; without them the app stays in-memory.
      # - key: SUPABASE_URL
      #   value: "https://nnmgcemoxuoahrhourpe.supabase.co"
      # - key: SUPABASE_KEY         # Supabase service_role key — keep secret
      #   sync: false
